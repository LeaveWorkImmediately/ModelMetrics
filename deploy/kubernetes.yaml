# ModelMetrics MVP: a single Prometheus instance hidden behind the ModelMetrics service name.
# Apply with: kubectl apply -f deploy/kubernetes.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: modelpilot
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: model-metrics
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: modelpilot
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: model-metrics-discovery
  labels:
    app.kubernetes.io/name: model-metrics
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: modelpilot
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: model-metrics-discovery
  labels:
    app.kubernetes.io/name: model-metrics
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: modelpilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: model-metrics-discovery
subjects:
  - kind: ServiceAccount
    name: model-metrics
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-metrics-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: model-metrics
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: modelpilot
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/device-rules.yml

    scrape_configs:
      # Optional: targets appear only when the MindCluster exporter is deployed.
      - job_name: npu-exporter
        metrics_path: /metrics
        scheme: http
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [npu-exporter]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: npu-exporter
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_name, __meta_kubernetes_pod_container_port_number]
            regex: npu-exporter;8082
            action: keep
          - target_label: cluster_id
            replacement: installation-local
          # Change only after real driver/profile acceptance, not merely deployment.
          - target_label: exporter_profile
            replacement: ascend-physical-percent-mib-watts-v1
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:8082