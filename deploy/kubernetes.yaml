# ModelMetrics MVP: a single Prometheus instance hidden behind the ModelMetrics service name.
# Apply with: kubectl apply -f deploy/kubernetes.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: modelpilot
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: model-metrics
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: modelpilot
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: model-metrics-discovery
  labels:
    app.kubernetes.io/name: model-metrics
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: modelpilot
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: model-metrics-discovery
  labels:
    app.kubernetes.io/name: model-metrics
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: modelpilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: model-metrics-discovery
subjects:
  - kind: ServiceAccount
    name: model-metrics
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-metrics-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: model-metrics
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: modelpilot
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      evaluation_interval: 15s

    scrape_configs:
      # Optional: targets appear only when the MindCluster exporter is deployed.
      - job_name: npu-exporter
        metrics_path: /metrics
        scheme: http
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [npu-exporter]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: npu-exporter
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:8082
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
      - job_name: modelflow-router
        metrics_path: /metrics
        scheme: http
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [default]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: modelflow-router
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-metrics-data
  namespace: monitoring
  labels:
    app.kubernetes.io/name: model-metrics
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: modelpilot
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: model-metrics
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: modelpilot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: model-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-metrics
        app.kubernetes.io/component: prometheus
        app.kubernetes.io/part-of: modelpilot
        app: prometheus
    spec:
      serviceAccountName: model-metrics
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus:v2.45.4
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --web.listen-address=:9090
          ports:
            - name: http
              containerPort: 9090
          env:
            - name: NO_PROXY
              value: ".svc,.svc.cluster.local,10.42.0.0/16,10.43.0.0/16,kubernetes.default.svc"
            - name: no_proxy
              value: ".svc,.svc.cluster.local,10.42.0.0/16,10.43.0.0/16,kubernetes.default.svc"
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: config
          configMap:
            name: model-metrics-config
        - name: data
          persistentVolumeClaim:
            claimName: model-metrics-data
---
apiVersion: v1
kind: Service
metadata:
  name: model-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: model-metrics
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: modelpilot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: model-metrics
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: model-metrics
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: modelpilot
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: model-metrics
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app.kubernetes.io/name: model-dashboard
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # K3s environment baseline: kubernetes.default.svc
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app.kubernetes.io/name: modelflow-router
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: npu-exporter
          podSelector:
            matchLabels:
              app: npu-exporter
      ports:
        - protocol: TCP
          port: 8082
