apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: model-node-exporter
  namespace: monitoring
  labels: {app.kubernetes.io/name: model-node-exporter, app.kubernetes.io/part-of: modelpilot}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: model-node-exporter}
  template:
    metadata:
      labels: {app.kubernetes.io/name: model-node-exporter, app.kubernetes.io/part-of: modelpilot}
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector: {modelpilot.io/device-observation: "true"}
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534}
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.8.2
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/(docker|containers|kubelet))($|/)
          ports: [{name: metrics, containerPort: 9100}]
          readinessProbe: {httpGet: {path: /metrics, port: metrics}, periodSeconds: 15}
          livenessProbe: {httpGet: {path: /metrics, port: metrics}, periodSeconds: 30}
          resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: 200m, memory: 96Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: proc, mountPath: /host/proc, readOnly: true}
            - {name: sys, mountPath: /host/sys, readOnly: true}
            - {name: root, mountPath: /host/root, readOnly: true, mountPropagation: HostToContainer}
      volumes:
        - {name: proc, hostPath: {path: /proc, type: Directory}}
        - {name: sys, hostPath: {path: /sys, type: Directory}}
        - {name: root, hostPath: {path: /, type: Directory}}
