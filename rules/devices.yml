# Enabled only for a locally verified profile with chip-level physical IDs,
# ratio input percent, HBM MiB and chip power watts. 310P card power is excluded.
groups:
  - name: modelpilot-device-observation
    interval: 15s
    rules:
      - record: modelpilot_accelerator_core_utilization_ratio
        expr: |
          label_replace(
            (max by (cluster_id,node,id) (npu_chip_info_utilization{exporter_profile="ascend-physical-percent-mib-watts-v1",id!="",vdie_id=""})
              == min by (cluster_id,node,id) (npu_chip_info_utilization{exporter_profile="ascend-physical-percent-mib-watts-v1",id!="",vdie_id=""})) >= 0 <= 100,
            "physical_id", "$1", "id", "(.+)"
          ) / 100
      - record: modelpilot_accelerator_memory_used_bytes
        labels: {memory_kind: hbm}
        expr: |
          label_replace(
            (max by (cluster_id,node,id) (npu_chip_info_hbm_used_memory{exporter_profile="ascend-physical-percent-mib-watts-v1",id!="",vdie_id=""})
              == min by (cluster_id,node,id) (npu_chip_info_hbm_used_memory{exporter_profile="ascend-physical-percent-mib-watts-v1",id!="",vdie_id=""})) >= 0 < +Inf,
            "physical_id", "$1", "id", "(.+)"
          ) * 1048576
      - record: modelpilot_accelerator_memory_total_bytes
        labels: {memory_kind: hbm}
        expr: |
          label_replace(
            (max by (cluster_id,node,id) (npu_chip_info_hbm_total_memory{exporter_profile="ascend-physical-percent-mib-watts-v1",id!="",vdie_id=""})
              == min by (cluster_id,node,id) (npu_chip_info_hbm_total_memory{exporter_profile="ascend-physical-percent-mib-watts-v1",id!="",vdie_id=""})) > 0 < +Inf,
            "physical_id", "$1", "id", "(.+)"
          ) * 1048576
      - record: modelpilot_accelerator_temperature_celsius
        labels: {sensor: chip}
        expr: |
          label_replace(
            (max by (cluster_id,node,id) (npu_chip_info_temperature{exporter_profile="ascend-physical-percent-mib-watts-v1",id!="",vdie_id=""})
              == min by (cluster_id,node,id) (npu_chip_info_temperature{exporter_profile="ascend-physical-percent-mib-watts-v1",id!="",vdie_id=""})) >= 0 < +Inf,
            "physical_id", "$1", "id", "(.+)"
          )
      - record: modelpilot_accelerator_power_watts
        expr: |
          label_replace(
            (max by (cluster_id,node,id) (npu_chip_info_power{exporter_profile="ascend-physical-percent-mib-watts-v1",id!="",vdie_id=""})
              == min by (cluster_id,node,id) (npu_chip_info_power{exporter_profile="ascend-physical-percent-mib-watts-v1",id!="",vdie_id=""})) >= 0 < +Inf,
            "physical_id", "$1", "id", "(.+)"
          )
      - record: modelpilot_node_cpu_utilization_ratio
        expr: 1 - avg by (cluster_id,node) (rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[5m]))
      - record: modelpilot_node_memory_available_bytes
        expr: max by (cluster_id,node) (node_memory_MemAvailable_bytes{job="node-exporter"})
      - record: modelpilot_node_memory_total_bytes
        expr: max by (cluster_id,node) (node_memory_MemTotal_bytes{job="node-exporter"})
